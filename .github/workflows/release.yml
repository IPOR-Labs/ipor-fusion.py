name: Release

# A push to main publishes a dev build of the next version (see the dev-build
# step in python-publish.yml); a manual run cuts a stable release. Both go
# through this caller so PyPI Trusted Publishing sees the same workflow.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force-semver-part:
        type: choice
        description: "SemVer part to increase (empty: auto)"
        options:
          - ""
          - "patch"
          - "minor"
          - "major"
        default: ""
      skip-version-bump:
        type: boolean
        description: "Skip version bump and release the version from pyproject.toml as-is"
        default: false

jobs:

  notify:
    uses: ./.github/workflows/notify-slack.yml
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.MAINNET_SLACK_BOT_TOKEN }}
    with:
      status-slack-channel-name: github-mainnet-ci

  release:
    needs: notify
    # Stable releases run one at a time. A dev build depends only on its
    # commit, so pushes get a group each: a shared one would cancel all but
    # the newest pending run and report them as failed.
    concurrency:
      group: release-${{ github.event_name == 'push' && github.sha || 'dispatch' }}
      cancel-in-progress: false
    uses: ./.github/workflows/python-publish.yml
    secrets:
      ETHEREUM_PROVIDER_URL: ${{ secrets.ETHEREUM_PROVIDER_URL }}
      ARBITRUM_PROVIDER_URL: ${{ secrets.ARBITRUM_PROVIDER_URL }}
      BASE_PROVIDER_URL: ${{ secrets.BASE_PROVIDER_URL }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SSH_SIGN_KEY_PRIVATE: ${{ secrets.SSH_SIGN_KEY_PRIVATE }}
      SSH_SIGN_KEY_PUBLIC: ${{ secrets.SSH_SIGN_KEY_PUBLIC }}
    with:
      publish-enabled: ${{ needs.notify.outputs.branch-name == 'main' }}
      force-semver-part: ${{ inputs.force-semver-part || '' }}
      skip-version-bump: ${{ inputs.skip-version-bump == true }}
      dev-build: ${{ github.event_name == 'push' }}

  report:
    if: ${{ always() }}
    needs:
      - notify
      - release
    uses: ./.github/workflows/report-slack.yml
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.MAINNET_SLACK_BOT_TOKEN }}
    with:
      success: ${{ needs.release.result == 'success' }}
      slack-status-msg-id: ${{ needs.notify.outputs.slack-status-msg-id }}
      status-slack-channel-name: github-mainnet-ci
      alarms-slack-channel-name: alarms-mainnet-github
