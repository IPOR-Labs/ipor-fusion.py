name: Crosschain readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crosschain-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arbitrum-hyperevm-usdc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up uv
        # v5.4.2
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --locked

      - name: Observe both USDC directions and factories
        id: probe
        run: uv run python scripts/crosschain_readiness.py --output readiness-report.json
        env:
          ARBITRUM_PROVIDER_URL: ${{ secrets.ARBITRUM_PROVIDER_URL }}
          HYPEREVM_PROVIDER_URL: ${{ secrets.HYPEREVM_PROVIDER_URL }}

      - name: Readiness summary
        if: ${{ always() && hashFiles('readiness-report.json') != '' }}
        run: |
          jq -r '
            "## Arbitrum ↔ HyperEVM USDC readiness\n\n```json\n" +
            ({complete, transport_ready, factories_ready, blocked_by,
              observed_blocks, repin_candidates, repin_status} | tojson) +
            "\n```\n\nA successful observation is not production acceptance."
          ' readiness-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized observations
        if: ${{ always() && steps.probe.outcome != 'skipped' }}
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crosschain-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness-report.json
          if-no-files-found: warn
          retention-days: 14
