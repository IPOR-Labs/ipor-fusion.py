name: Python publish

on:
  workflow_call:

    secrets:
      ARBITRUM_PROVIDER_URL:
        required: true
      BASE_PROVIDER_URL:
        required: true
      ETHEREUM_PROVIDER_URL:
        required: true
      GH_TOKEN:
        required: true
      SSH_SIGN_KEY_PRIVATE:
        required: true
      SSH_SIGN_KEY_PUBLIC:
        required: true

    inputs:
      python-version:
        description: "Python version"
        type: string
        default: 3.12
        required: false
      test-options:
        description: "Extra pytest options"
        type: string
        default: "-v -s"
        required: false
      format-code-enabled:
        description: "Enable code formatting"
        type: boolean
        default: true
        required: false
      static-code-analysis-enabled:
        description: "Enable static code analysis"
        type: boolean
        default: true
        required: false
      build-enabled:
        description: "Enable package build"
        type: boolean
        default: true
        required: false
      test-enabled:
        description: "Enable pytest tests"
        type: boolean
        default: true
        required: false
      publish-enabled:
        description: "Enable package publishing"
        type: boolean
        default: false
        required: false
      force-semver-part:
        description: "SemVer part to increase (empty: auto)"
        type: string
        default: ""
        required: false
      skip-version-bump:
        description: "Skip version bump and release the version from pyproject.toml as-is"
        type: boolean
        default: false
        required: false

jobs:
  python:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/ipor-fusion
    permissions:
      attestations: write
      checks: read
      contents: write
      deployments: write
      id-token: write
      packages: write
      statuses: read

    steps:
      - name: Checkout
        # from tag: v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up branch
        run: |
          git checkout -B ${{ github.ref_name }} ${{ github.sha }}

      - name: Set up uv
        # from tag: v5.4.2
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --frozen
        id: install

      - name: Build
        if: inputs.build-enabled
        run: uv build
        id: build

      - name: Tests
        if: inputs.test-enabled
        run: |
          uv run pytest ${{ inputs.test-options }}
        env:
          ETHEREUM_PROVIDER_URL: ${{ secrets.ETHEREUM_PROVIDER_URL }}
          ARBITRUM_PROVIDER_URL: ${{ secrets.ARBITRUM_PROVIDER_URL }}
          BASE_PROVIDER_URL: ${{ secrets.BASE_PROVIDER_URL }}
        id: tests

      - name: Format code
        if: inputs.format-code-enabled
        run: uv run ruff format --check ./
        id: format-code

      - name: Static code analysis
        if: inputs.static-code-analysis-enabled
        run: uv run ruff check ./
        id: static-code-analyze

      - name: Version release (semantic)
        if: inputs.publish-enabled && !inputs.skip-version-bump
        id: release
        # from tag: v10.5.3
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          git_committer_name: "bob-the-builder-ipor"
          git_committer_email: "106537082+bob-the-builder-ipor@users.noreply.github.com"
          ssh_public_signing_key: ${{ secrets.SSH_SIGN_KEY_PUBLIC }}
          ssh_private_signing_key: ${{ secrets.SSH_SIGN_KEY_PRIVATE }}
          build: true
          commit: true
          changelog: true
          tag: true
          push: true
          vcs_release: true
          force: ${{ inputs.force-semver-part }}

      # semantic-release reports success even when it writes no changelog at
      # all (update mode silently no-ops when the insertion flag is missing),
      # so the release commit quietly loses CHANGELOG.md. Assert it moved.
      - name: Verify changelog updated
        # `released` is the string "false" when nothing was released, and any
        # non-empty string is truthy in a GH expression - compare explicitly.
        if: inputs.publish-enabled && !inputs.skip-version-bump && steps.release.outputs.released == 'true'
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          SHA="${{ steps.release.outputs.commit_sha }}"
          # 0 = unchanged (the regression), 1 = changed (expected), anything
          # else = git itself failed and must not be read as "changed".
          # `|| rc=$?` keeps the non-zero exit from tripping the step's `bash -e`.
          rc=0
          git diff --quiet HEAD~1 HEAD -- CHANGELOG.md || rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::Release ${TAG} did not update CHANGELOG.md - aborting before publish."
            cat <<EOF
          semantic-release exited 0 but wrote no changelog. Find the cause before
          re-running - it is usually one of:

            a) python-semantic-release was upgraded and a default changed.
               Diff the fully-resolved config across the old and new versions:
                 semantic-release generate-config | sed -n '/\[semantic_release.changelog\]/,/^$/p'
               changelog.mode, insertion_flag and changelog_file all silently
               alter or disable changelog writing. This is the cause of the
               silent regression this guard was added to catch.
            b) CHANGELOG.md no longer contains the insertion_flag string that the
               CURRENT psr version expects (default "<!-- version list -->").
               In "update" mode a missing flag is a silent no-op.
            c) a templates/ directory was added. A non-empty template_dir
               REPLACES the built-in templates entirely; without a
               CHANGELOG.md.j2 inside it, no changelog is written at all.

          PyPI was NOT reached, so ${TAG} is still an unused version number.
          The version commit, the tag and the GitHub release ARE already
          created. To recover:

            1. delete the GitHub release for ${TAG} - the version step above
               created it, and a release outliving its tag blocks re-creating
               that tag later, so remove it before step 2
            2. git push --delete origin ${TAG}
            3. git revert ${SHA} on main - the "${TAG}" version commit
            4. fix the cause identified above. If it is (b), the flag is the
               literal line "<!-- version list -->" and belongs between the
               "# CHANGELOG" title and the newest version heading:

                   # CHANGELOG

                   <!-- version list -->

                   ## v1.2.3 (2026-01-01)

               semantic-release inserts each new release directly after it.
            5. re-run this workflow
          EOF
            exit 1
          elif [ "${rc}" -ne 1 ]; then
            echo "::error::Cannot tell whether release ${TAG} updated CHANGELOG.md: git diff exited ${rc}. Refusing to publish unverified."
            exit 1
          fi

      - name: Version release (from pyproject.toml)
        if: inputs.publish-enabled && inputs.skip-version-bump
        id: release-current
        run: |
          VERSION=$(uv version --short)
          TAG="v${VERSION}"

          git config user.name "bob-the-builder-ipor"
          git config user.email "106537082+bob-the-builder-ipor@users.noreply.github.com"

          uv build
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        # from tag: v10.5.3
        uses: python-semantic-release/publish-action@310a9983a0ae878b29f3aac778d7c77c1db27378
        if: inputs.publish-enabled && (steps.release.outputs.released || steps.release-current.outputs.released)
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          tag: ${{ steps.release.outputs.tag || steps.release-current.outputs.tag }}

      - name: Publish PyPI
        if: inputs.publish-enabled && (steps.release.outputs.released || steps.release-current.outputs.released)
        # from tag: v1.14.2 (twine 7 — knows Metadata-Version 2.5; the v1.14.0
        # twine rejected 2.5 wheels from hatchling >=1.32 and killed 3.6.0)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          print-hash: true
          verify-metadata: true
          attestations: false
        id: publish
